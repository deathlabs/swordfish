---
name: CI

on:
  push:
    branches: [ "**" ]
    paths:
      - ".github/workflows/**"
      - "backend/**"
      - "database/**"
      - "frontend/**"
      - "inference/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      dockerfile_lint_scan_failure_threshold:
        description: "Threshold to fail the Dockerfile lint scan."
        type: choice
        options: [error, warning, info, style, ignore]
        default: error
      sbom_scan_failure_threshold:
        description: "Threshold to fail the SBOM scan."
        type: choice
        options: [low, high, critical]
        default: low
  schedule:
    - cron: '00 12 * * *' 

jobs:

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
      - name: Run Trufflehog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: false

  python-code-lint:
    name: Python Code Lint Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - inference
          - tools
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Run Python Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=sarif --output-file=${{ matrix.container }}-lint-python-code-scan.sarif ${{ matrix.container }}
      - name: Print Code Lint Scan
        if: always()
        run: cat ${{ matrix.container }}-lint-python-code-scan.sarif
      - name: Upload Code Lint Scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.container }}-lint-python-code-scan
          path: ${{ matrix.container }}-lint-python-code-scan.sarif
  
  dockerfile-lint:
    name: Dockerfile Lint Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - database
          - frontend
          - inference
          - tools
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.container }}/Dockerfile
          failure-threshold: ${{ github.event.inputs.dockerfile_lint_scan_failure_threshold || 'error' }}
          format: sarif
          output-file: ${{ matrix.container }}-lint-dockerfile-scan.sarif
      - name: Print Dockerfile Lint Scan
        if: always()
        run: cat ${{ matrix.container }}-lint-dockerfile-scan.sarif
      - name: Upload Dockerfile Lint Scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.container }}-lint-dockerfile-scan.sarif
          archive: false

  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - database
          - frontend
          - inference
          - tools
    container:
      image: semgrep/semgrep
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Run Semgrep
        run: semgrep scan --config auto ${{ matrix.container }} --sarif --sarif-output=${{ matrix.container }}-sast-scan.sarif
      - name: Print SAST Scan
        if: always()
        run: cat ${{ matrix.container }}-sast-scan.sarif
      - name: Upload SAST Scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.container }}-sast-scan.sarif
          archive: false

  sca:
    name: SBOM Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - frontend
          - inference
          - tools
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
      - name: Run Syft
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.container }}
          format: cyclonedx-json
          output-file: ${{ matrix.container }}-sbom.json
          artifact-name: ${{ matrix.container }}-sbom.json
      - name: Run Grype
        id: grype
        uses: anchore/scan-action@v7.4.0
        with:
          sbom: ${{ matrix.container }}-sbom.json
          vex: ${{ hashFiles(format('.github/vex/{0}-vex.json', matrix.container)) != '' && format('.github/vex/{0}-vex.json', matrix.container) || '' }}
          severity-cutoff: ${{ github.event.inputs.sbom_scan_failure_threshold || 'low' }}
          output-format: cyclonedx-json
          output-file: ${{ matrix.container }}-sbom-scan.json
          fail-build: true
      - name: Print SBOM Scan
        if: always()
        run: jq -r '
            (.vulnerabilities // [])[] |
            [
              ((.ratings[]? | select(.severity != null) | .severity) // "unknown"),
              .id,
              (try ((.affects[0].ref // "") | capture("pkg:(?<pkg>[^?]+)").pkg) catch "unknown")
            ] | @tsv
          ' ${{ matrix.container }}-sbom-scan.json | sort | column -t
      - name: Upload SBOM Scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.container }}-sbom-scan.json
          archive: false
